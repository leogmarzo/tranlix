name: Tranlix

options:
  bundleIdPrefix: com.leomarzo
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 5DBQ7XM8R8
    # Hardened Runtime is on from day 1 so entitlement problems surface now rather than
    # at notarization time. The App Sandbox stays off: Developer ID distribution outside
    # the App Store does not require it, and enabling it would force security-scoped
    # bookmarks for the recordings folder and complicate Core Audio process taps.
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  TranlixKit:
    path: Packages/TranlixKit

targets:
  Tranlix:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "Tranlix.entitlements"
    # Info.plist and Tranlix.entitlements are hand-written and committed, wired in via
    # build settings below. Do NOT use XcodeGen's `info:`/`entitlements:` keys here —
    # those *generate* files at the given path and would silently overwrite the usage
    # descriptions and the audio-input entitlement on every `xcodegen generate`.
    settings:
      base:
        # The bundle id is fixed forever: TCC grants are keyed to signing identity plus
        # bundle id, and a stable pair is what keeps the microphone and audio-capture
        # permissions alive across rebuilds.
        PRODUCT_BUNDLE_IDENTIFIER: com.leomarzo.tranlix
        PRODUCT_NAME: Tranlix
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Tranlix.entitlements
        # Manual signing on purpose. Automatic signing makes xcodebuild reach out to the
        # developer portal for a provisioning profile, which hangs indefinitely in a
        # non-interactive shell. A Mac app that is not sandboxed and only asks for the
        # audio-input entitlement needs no profile, so signing straight with the
        # development certificate is both faster and scriptable. DEVELOPMENT_TEAM
        # disambiguates between the development certificates in the keychain, which keeps
        # this portable to the second machine.
        # Phase 5 flips CODE_SIGN_IDENTITY to "Developer ID Application" for notarization.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        PROVISIONING_PROFILE_SPECIFIER: ""
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: TranlixKit
        product: TranlixKit

schemes:
  Tranlix:
    build:
      targets:
        Tranlix: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
